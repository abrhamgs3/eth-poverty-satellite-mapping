[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-poverty-mapping"
version = "1.0.0"
description = "GPS-jitter and noisy-label diagnostics for satellite-based poverty mapping in Ethiopia"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
geo-poverty-mapping = "geo_poverty_mapping.pipeline:main"

[tool.setuptools.packages.find]
include = ["geo_poverty_mapping*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
